services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transferscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transferscout}
      POSTGRES_DB: ${POSTGRES_DB:-transferscout}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - transfer_scout_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transferscout}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transfer_scout_db_data:
